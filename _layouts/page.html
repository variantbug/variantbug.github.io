<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="alternate" type="application/rss+xml" title="VariantBug" href="/feed.xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}: VariantBug</title>
<meta property="og:type" content="article">
<meta property="og:site_name" content="VariantBug">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="Variant analysis and patch-diffing: hunting the siblings a patch left behind.">
<meta property="og:url" content="https://variantbug.com{{ page.url }}">
<meta property="og:image" content="https://variantbug.com/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  :root{--bg:#faf7f2;--panel:#ffffff;--line:#e8e2d8;--text:#2b3138;--muted:#5b6570;--dim:#8a94a0;--accent:#3d9a63;--link:#3d9a63;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme: dark){:root{--bg:#141619;--panel:#1d2025;--line:#2a2e35;--text:#e8e5df;--muted:#a9b0ba;--dim:#7d8590;--accent:#4db374;--link:#4db374}.content code{background:#262a30}}
  *{margin:0;padding:0;box-sizing:border-box}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
  .skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:#fff;padding:10px 18px;border-radius:0 0 10px 0;z-index:9}
  .skip:focus{left:0}
  body{background:var(--bg);color:var(--text);font:17px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--link)}a:hover{text-decoration:underline}
  .wrap{max-width:680px;margin:0 auto;padding:56px 24px 96px}
  h1{font:700 28px Georgia,serif;margin:14px 0 10px;line-height:1.35}
  .content h2{font:600 21px Georgia,serif;margin:38px 0 12px;color:var(--text);scroll-margin-top:20px}
  .content h3{font:600 17.5px var(--text);margin:26px 0 8px}
  .content a{text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
  .content strong{color:var(--text)}
  .content table{width:100%;border-collapse:collapse;margin:18px 0;font-size:15px}
  .content th,.content td{border:1px solid var(--line);padding:8px 10px;text-align:left}
  .content th{background:#f2efe8}
  @media (prefers-color-scheme: dark){.content th{background:#262a30}}
  .content img{max-width:100%;height:auto;border-radius:10px}
  .content p{margin:14px 0}
  .content ul,.content ol{margin:14px 0 14px 22px}
  .content li{margin:6px 0}
  .content code{font:13.5px var(--mono);background:#f2efe8;border-radius:5px;padding:1px 6px}
  .content pre{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto;margin:16px 0;box-shadow:0 2px 10px rgba(60,50,30,.05)}
  .content pre code{background:none;border:0;padding:0;font:12.5px/1.7 var(--mono)}
  .content blockquote{border-left:3px solid var(--line);padding:2px 0 2px 16px;color:var(--muted);margin:16px 0}
  .content hr{border:0;border-top:1px solid var(--line);margin:32px 0}
  footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);color:var(--dim);font:13px var(--mono);display:flex;gap:8px 20px;flex-wrap:wrap;align-items:center}
  footer .sp{flex:1}
  footer a{color:var(--muted)}
  footer a:hover{color:var(--accent)}
  .top{display:flex;align-items:center;gap:11px;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:34px}
  .dot{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;font:700 17px/30px var(--mono);text-align:center;flex:none}
  .brand{font:700 17px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--text)}
  .brand small{display:block;font:400 11.5px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--dim);margin-top:1px}
  .top .sp{flex:1}
  .top a.nav{font-size:13.5px;color:var(--muted);text-decoration:none}
  .top a.nav:hover{color:var(--accent)}
  @media(max-width:700px){
    .wrap{padding:24px 18px 64px}
    h1{font-size:24px}
    body{font-size:16.5px}
    .top{padding-bottom:16px;margin-bottom:26px}
    .top a.nav{display:none}
  }
</style>
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"TechArticle","headline":{{ page.title | jsonify }},"url":"https://variantbug.com{{ page.url }}","image":"https://variantbug.com/assets/og.jpg","author":{"@type":"Person","name":"Nguyen Thanh Tin","alternateName":"VariantBug","url":"https://variantbug.com/"},"publisher":{"@type":"Person","name":"VariantBug","url":"https://variantbug.com/"},"mainEntityOfPage":"https://variantbug.com{{ page.url }}"}
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap">
  <header class="top">
    <a href="/" style="display:flex;align-items:center;gap:11px;text-decoration:none"><div class="dot">+</div><div class="brand">VariantBug<small>independent security research</small></div></a>
    <div class="sp"></div>
    <a class="nav" href="/how">How I work</a>
  </header>
  <main id="main">
  <h1>{{ page.title }}</h1>
  <div class="content">{{ content }}</div>
  </main>
  <footer>
    <a href="/">&larr; VariantBug</a>
    <span class="sp"></span>
    <a href="/how">How I work</a>
    <a href="https://github.com/variantbug">GitHub</a>
    <a href="mailto:hello@variantbug.com">hello@variantbug.com</a>
    <a href="/feed.xml">RSS</a>
  </footer>
</div>
</body>
</html>
