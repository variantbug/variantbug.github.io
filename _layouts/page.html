<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — VariantBug</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d1117'/%3E%3Ctext x='3' y='12' font-size='11' fill='%233fb950' font-family='monospace'%3EV%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#21262d;--text:#e6edf3;--muted:#b6bec8;--dim:#8b949e;--accent:#3fb950;--link:#58a6ff;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--link)}a:hover{text-decoration:underline}
  .wrap{max-width:680px;margin:0 auto;padding:56px 24px 96px}
  h1{font-size:26px;letter-spacing:-.01em;margin:14px 0 10px;line-height:1.3}
  .content h2{font-size:19px;margin:36px 0 12px;letter-spacing:-.01em;color:var(--text)}
  .content p{margin:14px 0}
  .content ul,.content ol{margin:14px 0 14px 22px}
  .content li{margin:6px 0}
  .content code{font:13.5px var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .content pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto;margin:16px 0}
  .content pre code{background:none;border:0;padding:0;font:12.5px/1.7 var(--mono)}
  .content blockquote{border-left:3px solid var(--line);padding:2px 0 2px 16px;color:var(--muted);margin:16px 0}
  .content hr{border:0;border-top:1px solid var(--line);margin:32px 0}
  footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);color:var(--dim);font:13px var(--mono)}
</style>
</head>
<body>
<div class="wrap">  <h1>{{ page.title }}</h1>
  <div class="content">{{ content }}</div>
  <footer><a href="/">← VariantBug</a></footer>
</div>
</body>
</html>
