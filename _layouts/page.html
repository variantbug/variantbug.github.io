<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}: VariantBug</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%233d9a63'/%3E%3Ctext x='4' y='12' font-size='11' fill='white' font-family='monospace'%3E+%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#faf7f2;--panel:#ffffff;--line:#e8e2d8;--text:#2b3138;--muted:#5b6570;--dim:#8a94a0;--accent:#3d9a63;--link:#3d9a63;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme: dark){:root{--bg:#141619;--panel:#1d2025;--line:#2a2e35;--text:#e8e5df;--muted:#a9b0ba;--dim:#7d8590;--accent:#4db374;--link:#4db374}.content code{background:#262a30}}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font:17px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--link)}a:hover{text-decoration:underline}
  .wrap{max-width:680px;margin:0 auto;padding:56px 24px 96px}
  h1{font:700 28px Georgia,serif;margin:14px 0 10px;line-height:1.35}
  .content h2{font:600 21px Georgia,serif;margin:38px 0 12px;color:var(--text)}
  .content p{margin:14px 0}
  .content ul,.content ol{margin:14px 0 14px 22px}
  .content li{margin:6px 0}
  .content code{font:13.5px var(--mono);background:#f2efe8;border-radius:5px;padding:1px 6px}
  .content pre{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto;margin:16px 0;box-shadow:0 2px 10px rgba(60,50,30,.05)}
  .content pre code{background:none;border:0;padding:0;font:12.5px/1.7 var(--mono)}
  .content blockquote{border-left:3px solid var(--line);padding:2px 0 2px 16px;color:var(--muted);margin:16px 0}
  .content hr{border:0;border-top:1px solid var(--line);margin:32px 0}
  footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);color:var(--dim);font:13px var(--mono)}
</style>
</head>
<body>
<div class="wrap">  <h1>{{ page.title }}</h1>
  <div class="content">{{ content }}</div>
  <footer><a href="/">← VariantBug</a></footer>
</div>
</body>
</html>
